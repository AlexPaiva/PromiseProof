name: Submission hardening

on:
  push:
    branches: [main]
    tags: ['submission-hardening-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-integrity:
    name: Fast integrity (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required history
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse --verify 'bcadb6ea75b17666e8e509cbfb25b7f838cf846c^{commit}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git rev-parse --verify 'milestone-03-gpt56-investigation^{commit}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run evidence:verify
      - run: npm run test:evidence:unit
      - run: npm run test:investigation:unit
      - run: npm run test:investigation:offline
      - run: npm run test:determinism
      - run: npm run test:expected-red

  browser-foundation:
    name: Browser foundation (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required history
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse --verify 'bcadb6ea75b17666e8e509cbfb25b7f838cf846c^{commit}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git rev-parse --verify 'milestone-03-gpt56-investigation^{commit}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run test:expected-red

  repair-rehearsal:
    name: Repair rehearsal & sandbox fail-closed (Windows)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required history
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse --verify 'bcadb6ea75b17666e8e509cbfb25b7f838cf846c^{commit}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git rev-parse --verify 'milestone-03-gpt56-investigation^{commit}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:repair:offline
      - run: npm run test:repair:elevated-sandbox
      - name: Preserve safe failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repair-rehearsal-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  judge-deliverable:
    name: Judge deliverable (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required history
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse --verify 'bcadb6ea75b17666e8e509cbfb25b7f838cf846c^{commit}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git rev-parse --verify 'milestone-03-gpt56-investigation^{commit}'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:site
      - run: npm run test:judge:unit
      - run: npm run test:judge:interface
      - run: npm run demo:rehearse
      - name: Preserve safe judge failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: judge-deliverable-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
