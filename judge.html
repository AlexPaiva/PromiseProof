<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#080b12" />
    <meta
      name="description"
      content="PromiseProof shows how a product broke a promise to users, then proves the fix without letting any AI grade its own work. A recorded, no-key, five-stage walkthrough: Observe, Investigate, Replay, Repair, Prove."
    />
    <title>PromiseProof: find the boundary that broke the promise</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PromiseProof" />
    <meta
      property="og:title"
      content="PromiseProof: find the boundary that broke the promise"
    />
    <meta
      property="og:description"
      content="A user turned personalization off, yet identifiable activity still reached the recommendation service. GPT-5.6 proposed the diagnosis, Codex proposed a two-file fix, a human approved the exact patch, and unchanged tests decided whether it actually worked."
    />
    <meta property="og:image" content="/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PromiseProof: find the boundary that broke the promise." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="PromiseProof: find the boundary that broke the promise"
    />
    <meta
      name="twitter:description"
      content="Find the boundary that broke a product promise, and prove the fix without letting AI grade its own work."
    />
    <meta name="twitter:image" content="/og-card.png" />
  </head>
  <body>
    <div id="judge-root" class="judge-shell" data-testid="judge-root" data-stage="observe">
      <header class="judge-topbar">
        <a class="judge-brand" href="/" aria-label="Back to the PromiseProof overview">
          <span class="judge-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="judge-brand-text">
            <strong>PromiseProof</strong>
            <small>Find the boundary that broke the promise.</small>
          </span>
        </a>
        <div class="judge-topbar-actions">
          <a class="judge-home-link" href="/" data-testid="judge-home">&larr; Back to overview</a>
          <p class="judge-offline-chip" data-testid="offline-chip">
            <span class="judge-dot" aria-hidden="true"></span>
            Recorded run, no live model calls
          </p>
          <button
            type="button"
            id="judge-how"
            class="judge-how-button"
            data-testid="judge-how"
            aria-haspopup="dialog"
            aria-expanded="false"
          >How it works</button>
        </div>
      </header>

      <nav class="judge-nav" aria-label="Journey stages">
        <ol id="judge-nav-list" class="judge-nav-list" data-testid="judge-nav"></ol>
      </nav>

      <main id="judge-stage" class="judge-stage" data-testid="judge-stage" tabindex="-1"></main>

      <footer class="judge-footer">
        <div class="judge-stage-controls">
          <button
            type="button"
            id="judge-previous"
            class="judge-button"
            data-testid="judge-previous"
          >Previous step</button>
          <button
            type="button"
            id="judge-next"
            class="judge-button judge-button-primary"
            data-testid="judge-next"
          >Next step</button>
          <button
            type="button"
            id="judge-reset"
            class="judge-button judge-button-quiet"
            data-testid="judge-reset"
          >Reset</button>
        </div>
        <p class="judge-footnote">
          The demo app used here, a small app called Signal Shelf, exists only
          to make this one broken promise visible. The whole walkthrough is a
          recorded run, with no live model calls.
        </p>
      </footer>
    </div>

    <script type="module" src="/src/judge/main.ts"></script>
  </body>
</html>
