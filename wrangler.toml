# Deploys the combined PromiseProof site (landing at / , walkthrough at
# /walkthrough/) as a static-assets Worker, in place at the live url:
#   https://promiseproof.alex0paiva0.workers.dev/
#
#   Rebuild:  npm run build:site
#   Deploy:   npx wrangler deploy
#   (first run opens a browser once to log in to your Cloudflare account)

name = "promiseproof"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist/site"
